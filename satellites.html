    const c = clamp((t - (TOTAL - 2.7)) / 0.6) * (1 - sm((t - (TOTAL - 0.5)) / 0.45)); if (c > 0) { g.save(); g.globalAlpha = c; g.font = `700 50px ${MONO}`; g.textAlign = "center"; g.fillStyle = "#ddf8ff"; g.shadowColor = "#38d6f5"; g.shadowBlur = 18;
      g.fillText("WITHOUT GENERAL RELATIVITY", OW / 2, OH * 0.47); g.font = `600 20px ${MONO}`; g.fillText("GPS WOULD NOT SURVIVE A SINGLE DAY", OW / 2, OH * 0.47 + 50); g.restore(); } }
  if (sh.end) noGR(g, t);

// =============================================================================
// Frame
// =============================================================================
let curShot = null, frameNo = 0;
function renderFrame(t) {
  const sh = shotAt(t);
  if (sh !== curShot) { curShot = sh; for (const k in S) S[k].root.visible = sh.use.includes(k); }
  const u = clamp((t - sh.t0) / Math.max(0.001, sh.t1 - sh.t0));
  const space = sh.use.includes("earth");
  camera.near = sh.near || (space ? 0.3 : 0.1); camera.far = 9000; camera.fov = sh.fov || 40; camera.aspect = RW / RH; camera.updateProjectionMatrix();
  stars.visible = space || sh.use.includes("sr") || sh.use.includes("well"); sunLight.intensity = sh.use.includes("mcr") ? 0.15 : 3.4; earthLight.intensity = sh.use.includes("mcr") ? 0 : 0.55;
  lensflare.visible = space && !CLEAN; if (CLEAN) CON.orbits.forEach((l) => { l.visible = false; });
  if (S.sr.root.visible) { const pre = !!sh.pre; SR.sat.visible = !pre; SR.lines.visible = !pre; }
  HERO.userData.explode = sh.explode ? sm((t - sh.t0) / Math.min(1.2, (sh.t1 - sh.t0) * 0.6)) * 1.0 : 0;
  for (const k of sh.use) S[k].update && S[k].update(t);
  if (sh.pre) { SR.cs.position.set(-7, 0, 0); SR.cg.position.set(7, 0, 0); SR.cs.scale.setScalar(1.4); SR.cg.scale.setScalar(1.4); SR.gam.visible = false; } else { SR.cs.position.set(-24, 15, -12); SR.cg.position.set(24, 15, -12); SR.cs.scale.setScalar(3.6); SR.cg.scale.setScalar(3.6); }
  if (sh.born) { const bu = clamp((t - sh.t0) / ((sh.t1 - sh.t0) * 0.85)); HERO.userData.arms.forEach((a, i) => { a.rotation.z = (i ? 1 : -1) * (1 - sm(bu)) * 1.45; }); } else HERO.userData.arms.forEach((a) => { a.rotation.z = 0; });
  sh.cam(t, u); camera.updateMatrixWorld();
  setWipe(wipeFor(sh, t));
  // reflections + earthshine follow the hero
  const H = sh.use.includes("dc") ? DC.center : sh.nasa && NASA[sh.nasa] ? NASA[sh.nasa].pos : satPos(0, t), eDir = space ? H.clone().normalize().negate() : V(0, -1, 0); updateEnv(eDir);
  const tgt = space ? H : V(0, 0, 0); earthLight.target.position.copy(tgt); earthLight.position.copy(tgt).addScaledVector(eDir, 10);

// =============================================================================
// Player: song loading (Suno mp3), preview clock, sync tool, recorder
// =============================================================================
const au = $("au"); let manualT = null, running = false, recording = null, hasSong = false, pt = 0, pPlay = false, pLast = 0;
const comp = document.createElement("canvas"); comp.width = RW; comp.height = RH; const cctx = comp.getContext("2d");
function loadSong(src) { au.src = src; hasSong = true; au.load(); }
au.addEventListener("loadedmetadata", () => { if (isFinite(au.duration)) { TOTAL = au.duration; applyCues(); } });
au.addEventListener("error", () => { hasSong = false; });
loadSong(params.get("song") || "assets/thirty-two-clocks.mp3");

const nowT = () => { if (manualT !== null && !playing()) return manualT; return hasSong ? au.currentTime : pt; };

function seekTo(t) { manualT = t; if (hasSong) au.currentTime = t; pt = t; }
function tick() {
  if (!hasSong && pPlay) { const n = performance.now(); pt += (n - pLast) / 1000; pLast = n; if (pt >= TOTAL) { pPlay = false; } }
  const t = clamp(nowT(), 0, TOTAL - 0.001); renderFrame(t);
  $("seek").value = t; $("tc").textContent = Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0"); $("pp").textContent = playing() ? "pause" : "play";
  if (recording) { cctx.drawImage($("c"), 0, 0); cctx.drawImage($("ov"), 0, 0); if (au.ended || (!hasSong && !pPlay)) stopRec(); }
  syncUpdate(t); requestAnimationFrame(tick);
}
function begin() { $("start").style.display = "none"; if (!running) { running = true; tick(); } }
$("start").onclick = () => { begin(); seekTo(0); play(); };
$("pp").onclick = () => { begin(); playing() ? pause() : play(); };
$("seek").oninput = (e) => seekTo(+e.target.value);
$("file").onchange = (e) => { const f = e.target.files[0]; if (f) { loadSong(URL.createObjectURL(f)); begin(); seekTo(0); } };
addEventListener("dragover", (e) => { e.preventDefault(); $("drop").style.display = "flex"; });
addEventListener("dragleave", () => { $("drop").style.display = "none"; });
addEventListener("drop", (e) => { e.preventDefault(); $("drop").style.display = "none"; const f = e.dataTransfer.files[0]; if (f) { loadSong(URL.createObjectURL(f)); begin(); seekTo(0); } });
window.__seek = (t) => { if (!running) { running = true; $("start").style.display = "none"; tick(); } if (hasSong) au.pause(); pPlay = false; seekTo(t); };
let actx = null, adest = null;
function audioStream() { try { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); const src = actx.createMediaElementSource(au); adest = actx.createMediaStreamDestination(); src.connect(actx.destination); src.connect(adest); }
  if (actx.state === "suspended") actx.resume(); return adest.stream; } catch (e) { return null; } }
function startRec() { begin(); pause(); seekTo(0);
  const st = comp.captureStream(30); const as = hasSong ? audioStream() : null; as && as.getAudioTracks().forEach((tr) => st.addTrack(tr));
  const mt = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
  const mr = new MediaRecorder(st, { mimeType: mt, videoBitsPerSecond: 24e6, audioBitsPerSecond: 192e3 }); const chunks = []; mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  mr.onstop = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" })); a.download = "thirty-two-clocks.webm"; a.click(); };
  mr.start(500); recording = mr; play(); $("rec").textContent = hasSong ? "recording… (with audio)" : "recording… (no song loaded)"; }
function stopRec() { recording && recording.stop(); recording = null; $("rec").textContent = "export webm"; }
$("rec").onclick = () => (recording ? stopRec() : startRec());
addEventListener("keydown", (e) => { if ((e.key === "r" || e.key === "R") && !SYNC) $("rec").click(); });
// ?sync — tap Space at the first word of each line; saved per song length
const SYNC = params.has("sync"); let sidx = 0; const taps = [];
function syncUpdate(t) { if (!SYNC) return; const el = $("sync"); el.style.display = "block"; const from = Math.max(0, sidx - 6);
  el.textContent = "SYNC · play the song · Space = first word of ▶ line · Backspace = undo\n" + LINES.slice(from, from + 18).map((l, j) => { const i = from + j; return (i === sidx ? "▶ " : "  ") + (taps[i] != null ? taps[i].toFixed(2) : "  -  ") + "  " + l.txt; }).join("\n") + (sidx >= LINES.length ? "\n\nSAVED ✓ reload to watch" : ""); }
if (SYNC) addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); if (sidx < LINES.length) { taps[sidx++] = nowT(); if (sidx === LINES.length) { localStorage.setItem(cueKey(), JSON.stringify(taps)); console.log(JSON.stringify(taps)); } } } else if (e.key === "Backspace") sidx = Math.max(0, sidx - 1); });
applyCues();
{ const chk = () => { if (pending > 0) { setTimeout(chk, 200); return; } document.querySelector('#start span').textContent = 'CLICK · PLAY'; window.__ready = true; }; chk(); }
