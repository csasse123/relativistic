<script type="module">
import * as THREE from "three";

// =============================================================================
// Cue table — every lyric line of "Thirty-Two Clocks" (docs/SUNO.md).
// Defaults follow the 132 BPM plan; scaled to the loaded song; ?sync taps exact.
// =============================================================================
const PLAN_LINES = [];
function alloc(a, b, defs, gap = 0.12) {

}
alloc(0.8, 1.9, [["att", 3, "Attention."]]);
alloc(2.6, 3.6, [["look", 2, "Look up."]]);
alloc(4.6, 9.2, [["clocks", 12, "Thirty-two clocks are falling on you. Right now."]]);
alloc(10.0, 11.6, [["land", 4, "None of them land."]]);
alloc(14.4, 15.2, [["fall", 1, "Fall."]]);

alloc(18.6, 46.6, [["alt", 12, "Twenty thousand klicks up. Fourteen thousand an hour."], ["miss", 10, "Falling every second. Missing every second."], ["curve", 11, "The Earth curves away as fast as they drop."],

alloc(69.0, 82.0, [["speed", 2, "Speed first."], ["moving", 5, "Moving clocks run slow."], ["gamma", 16, "Gamma. One over root of one minus v squared over c squared."], ["m7", 12, "Minus seven microseconds. Every single day."]]);
alloc(82.6, 97.4, [["height", 2, "Then height."], ["less", 6, "Less gravity. Less pull on time."], ["phi", 10, "Phi over c squared. The high clock runs fast."], ["p45", 9, "Plus forty-five. Net thirty-eight."],
  ["times", 8, "Times light — eleven klicks a day."], ["slow", 8, "So they build it slow on the ground."], ["num", 16, "Ten point two two nine nine nine nine nine nine five four three."], ["born", 9, "Born slow. To tick true in the sky."]]);

alloc(120.2, 126.4, [["o1", 5, "You opened a map."], ["o2", 6, "You used relativity."], ["o3", 6, "They're still falling."]]);
PLAN_LINES.sort((a, b) => a.t0 - b.t0);
let LINES = PLAN_LINES.map((l) => ({ ...l }));
const idx = {}; const reindex = () => LINES.forEach((l) => { idx[l.id] = l; });
reindex();
const T0 = (id) => idx[id].t0, T1 = (id) => idx[id].t1, DUR = (id) => idx[id].t1 - idx[id].t0;
const cueKey = () => "sat.cues." + Math.round(TOTAL);

  let sv = null; try { sv = JSON.parse(localStorage.getItem(cueKey()) || "null"); } catch (e) {}
  if (sv && sv.length === PLAN_LINES.length) { LINES = PLAN_LINES.map((l, i) => ({ ...l, t0: sv[i] }));
    LINES.forEach((l, i) => { const n = LINES[i + 1]; l.t1 = n ? Math.min(n.t0 - 0.1, l.t0 + 7) : TOTAL; }); }
  else { const k = TOTAL / PLAN; LINES = PLAN_LINES.map((l) => ({ ...l, t0: l.t0 * k, t1: l.t1 * k })); }
  reindex(); buildShots(); buildFall(); $("seek").max = TOTAL;
}

// =============================================================================
// Renderer + helpers

const RW = 1280, RH = 720;

function eq(str, w = 6, color = "#bff6ff", opts = {}) {
  const px = opts.px || 64, cw = 1024, ch = 128;
  const c = document.createElement("canvas"); c.width = cw; c.height = ch; const g = c.getContext("2d");
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const draw = (s) => { g.clearRect(0, 0, cw, ch); g.font = `${opts.font || ""} ${px}px ${opts.mono ? MONO : MATH}`; g.textBaseline = "middle";
    let sc = 1; const m = g.measureText(s).width; if (m > cw - 40) sc = (cw - 40) / m; g.save(); g.translate(cw / 2, ch / 2); g.scale(sc, sc);
    g.textAlign = "center"; g.shadowColor = color; g.shadowBlur = 18; g.fillStyle = color; g.fillText(s, 0, 0); g.fillStyle = "#fff"; g.shadowBlur = 0; g.globalAlpha = .55; g.fillText(s, 0, 0); g.restore(); tex.needsUpdate = true; };
  draw(str);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * ch / cw), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, ...ADD, opacity: opts.opacity ?? 1 }));

}
const S = {};
const mk = (name) => { const root = new THREE.Group(); root.visible = false; scene.add(root); S[name] = { root }; return S[name]; };
const noCull = (o) => { o.frustumCulled = false; return o; };

// =============================================================================
// Formula rain (camera-centred instanced glyphs)
// =============================================================================
const FORMULAS = ["γ=1/√(1−v²/c²)","Δτ=−v²/2c²","ΔΦ/c²","GM/c²r","−7.2 μs","+45.7 μs","+38.6 μs","×c","1 ns=30 cm","10.22999999543 MHz","9 192 631 770 Hz","r=26 561 km","v=3.874 km/s",
  "T=11 h 58 m","(x,y,z,t)","|r−rᵢ|=c(t−tᵢ)","ds²=−c²dτ²","g₀₀=−(1+2Φ/c²)","Gμν=8πG/c⁴ Tμν","∇²Φ=4πGρ","F=GMm/r²","v=√(GM/r)","a=v²/r","4.9 m","8 km","Δf/f","−4.4647×10⁻¹⁰",
  "1575.42 MHz","154×10.23","Sagnac 133 ns","e sin E","−2√(GMa)/c²","Ω","ω","φ","γ","τ","Δt","c","∂ₜ","∇","∞","μs","ns","λ","ψ","Σ","π","GPS","L1","Cs","Rb","t′","x′","dτ/dt","√(1−2GM/rc²)","38 μs","11 km","32","4","c²","Φ","δt","Δν"];

const NRAIN = 1500;
const rainGeo = new THREE.InstancedBufferGeometry(); rainGeo.copy(new THREE.PlaneGeometry(1, 1)); rainGeo.instanceCount = NRAIN;
{ const r = rng(11), b = new Float32Array(NRAIN * 3), s = new Float32Array(NRAIN * 4);
  for (let i = 0; i < NRAIN; i++) { b[i * 3] = r(); b[i * 3 + 1] = r(); b[i * 3 + 2] = r(); s[i * 4] = i / NRAIN; s[i * 4 + 1] = Math.floor(r() * FORMULAS.length); s[i * 4 + 2] = 0.5 + r() * 1.4; s[i * 4 + 3] = r(); }

  vertexShader: `uniform float uFall,uAlpha,uDens,uShear,uScale; uniform vec3 uCam,uBox; attribute vec3 aBase; attribute vec4 aS; varying vec2 vUv; varying float vA; varying float vS;

function rainP(t) {

  if (t < T0("drop")) return { a: 0.7, v: 9, dens: 0.3, sh: 0.1, tint: 0 };
  if (t < T0("up")) return { a: 0.8, v: 14, dens: 0.6, sh: 0.4 * Math.exp(-(t - T0("drop")) / 2), tint: 0 };
  if (t < T0("c1")) return { a: 0.5, v: 5, dens: 0.3, sh: 0, tint: 0 };
  if (t < T0("speed")) return { a: 0.95, v: 18, dens: 1, sh: 0.2, tint: 0.2 };
  if (t < T0("height")) return { a: 0.8, v: 22, dens: 0.7, sh: 0.6, tint: 0 };
  if (t < T0("c5")) return { a: 0.7, v: 8, dens: 0.55, sh: 0, tint: 0.5 };
  if (t < T0("ch1")) return { a: 0.95, v: 18, dens: 1, sh: 0.2, tint: 0.2 };

}
let fallTab = [0];

// =============================================================================
// EARTH — real coastlines + city lights (assets/earth_*.jpg), day/night,
// clouds, atmosphere, imaging swath under the hero satellite.
// =============================================================================
const R = 100, SUN = V(0, 0, 1);
const loader = new THREE.TextureLoader();
const tx = (f) => { const t = loader.load(f); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const earthMat = new THREE.ShaderMaterial({
  uniforms: { uDay: { value: tx("assets/earth_day.jpg") }, uNight: { value: tx("assets/earth_night.jpg") }, uCloud: { value: tx("assets/earth_clouds.jpg") },
    uSun: { value: SUN }, uScan: { value: V(0, 1, 0) }, uScanN: { value: V(1, 0, 0) }, uScanV: { value: V(0, 0, 1) }, uScanOn: { value: 0 }, uT: { value: 0 }, uPin: { value: V(0, 1, 0) }, uPinOn: { value: 0 } },

const EARTH = mk("earth");
const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 192, 128), earthMat); EARTH.root.add(earth);
const atm = new THREE.Mesh(new THREE.SphereGeometry(R * 1.025, 96, 64), new THREE.ShaderMaterial({ uniforms: { uSun: { value: SUN } }, side: THREE.BackSide, ...ADD,
  vertexShader: `varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,

const sunGlow = glow(0xfff1d0, 900, 0.9); EARTH.root.add(sunGlow); function sunGlowFix() { sunGlow.position.copy(SUN).multiplyScalar(4000); }

// =============================================================================
